# fly.toml - configuratie Fly.io pentru QualiTrace Backend
# Documentatie: https://fly.io/docs/reference/configuration/

app = "qualitrace-backend"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"
  DB_DATA_DIR = "/data"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[[mounts]]
  source = "qualitrace_data"
  destination = "/data"
  initial_size = "1gb"
